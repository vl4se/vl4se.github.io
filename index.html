<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KTM 1290 Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bezel:#000;--screen:#16263f;--panel:#b9bcbd;--ink:#1c3354;--white:#fff;--red:#d8334a;--yel:#e8c21a;--logo:#3f6fa3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{position:fixed;left:0;top:0;width:100%;height:100%;margin:0;overscroll-behavior:none;background:var(--screen);touch-action:manipulation;-webkit-touch-callout:none;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:667px;height:375px;background:var(--screen);overflow:hidden;transform-origin:center}
svg{width:667px;height:375px;display:block;font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:600}
text{fill:var(--ink)}
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 667 375" xmlns="http://www.w3.org/2000/svg">
  <!-- светлая панель -->
  <path d="M26,338 L26,214 Q26,190 44,174 L128,88 Q146,70 172,70 L641,70 L641,338 Z" fill="var(--panel)"/>
  <!-- тахометр -->
  <defs><clipPath id="outer"><path d="M26,338 L62,300 L62,222 Q62,210 71,202 L152,134 Q168,122 190,122 L641,122 L641,70 L172,70 Q146,70 128,88 L44,174 Q26,190 26,214 Z"/></clipPath></defs>
  <g clip-path="url(#outer)"><path id="orange" fill="none" stroke="#ff7a00" stroke-width="200" stroke-linejoin="round" d="M26,338 L62,300 L62,222 Q62,210 71,202 L152,134 Q168,122 190,122 L641,122"/></g>
  <path id="track" fill="none" stroke="#000" stroke-width="2.5" d="M26,338 L62,300 L62,222 Q62,210 71,202 L152,134 Q168,122 190,122 L641,122"/>
  <path id="redTrack" fill="none" stroke="var(--red)" stroke-width="2.5" d="M26,338 L62,300 L62,222 Q62,210 71,202 L152,134 Q168,122 190,122 L641,122"/>
  
  
  <g id="labels" font-size="22" text-anchor="middle"></g>
  <text x="636" y="116" font-size="11" text-anchor="end">x10 km/h</text>

  <!-- передача -->
  <text x="26" y="104" font-size="104" font-weight="700" style="fill:var(--white)">3</text>
  <text id="clock" x="100" y="62" font-size="22" style="fill:var(--white)">--:--</text>


  <!-- скорость -->
  <text id="spd" x="618" y="262" font-size="140" font-weight="700" text-anchor="end">0</text>
  <g id="noGps" transform="translate(528,160)" visibility="hidden">
    <rect x="4" y="4" width="92" height="104" rx="20" fill="none" stroke="var(--ink)" stroke-width="9"/>
    <line x1="22" y1="96" x2="78" y2="16" stroke="var(--ink)" stroke-width="9"/>
  </g>
  <text x="618" y="288" font-size="18" text-anchor="end">km/h</text>

  <!-- нижняя строка -->
  <rect x="76" y="304" width="104" height="30" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="128" y="328" font-size="24" text-anchor="middle" letter-spacing="1">TRACK</text>
  <line x1="204" y1="306" x2="204" y2="334" stroke="var(--red)" stroke-width="2"/>
  <text x="328" y="328" font-size="26" text-anchor="middle">ABS <tspan font-weight="700">OFF</tspan></text>
  <line x1="450" y1="306" x2="450" y2="334" stroke="var(--red)" stroke-width="2"/>
  <g id="oilBtn" style="cursor:pointer">
    <rect x="456" y="300" width="180" height="38" fill="transparent"/>
    <text x="472" y="326" font-size="16">TEMP</text>
    <text id="oil" x="526" y="328" font-size="28" font-weight="700">--°C</text>
  </g>

  <!-- лого -->
  <text x="333" y="365" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="3" style="fill:var(--logo);font-style:italic">KTM</text>
</svg>
</div>

<script>
(function(){
  var MAX = 60, RED = 35;           // км/ч: полная шкала и начало красной зоны
  var $ = function(i){return document.getElementById(i)};

  /* масштаб под iPhone 7 (667x375), в портрете — поворот */
  var a0=null;
  function ang(){var a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);return ((a%360)+360)%360}
  function fit(){
    var W=innerWidth,H=innerHeight;
    if(Math.min(W,H)<150) return;
    var p=H>W, s=Math.min(Math.max(W,H)/667,Math.min(W,H)/375), r=0;
    if(p) r=90; else { var a=ang(); if(a0===null) a0=a; if(Math.abs(a-a0)===180) r=180; }
    $('stage').style.transform='translate(-50%,-50%) rotate('+r+'deg) scale('+s+')';
  }
  addEventListener('resize',fit);
  addEventListener('orientationchange',function(){setTimeout(fit,200);setTimeout(fit,800)});
  fit(); setInterval(fit,1500);

  /* шкала тахометра */
  var orange=$('orange'),redTrack=$('redTrack'),track=$('track');
  var L=track.getTotalLength(), redStart=L*RED/MAX;
  redTrack.style.strokeDasharray='0 '+redStart+' '+(L-redStart)+' '+L;
  var g=$('labels'),labs=[];
  for(var i=1;i<=6;i++){
    var len=L*i/6, pt=track.getPointAtLength(Math.min(len,L-1));
    var a=track.getPointAtLength(Math.max(len-2,0)), b=track.getPointAtLength(Math.min(len+2,L));
    var dx=b.x-a.x, dy=b.y-a.y, m=Math.hypot(dx,dy)||1;
    var nx=dy/m, ny=-dx/m, off=26;
    var t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',Math.min(pt.x+nx*off,628)); t.setAttribute('y',pt.y+ny*off+8);
    t.textContent=i; t._i=i; t.style.fill=(i*10>=RED?'var(--red)':'#000'); labs.push(t);
    g.appendChild(t);
  }

  var target=0, shown=0;
  function draw(){
    shown += (target-shown)*0.18;
    var v=Math.max(0,Math.min(shown,MAX)), len=L*v/MAX;
    var blink=v>=RED && Math.floor(Date.now()/130)%2===1;
    orange.style.strokeDasharray=len+' '+L;
    orange.style.visibility=(blink||len<1)?'hidden':'visible';
    for(var j=0;j<labs.length;j++){var q=labs[j],on=!blink&&v>=q._i*10;
      if(q._on!==on){q._on=on;q.style.fill=on?'#fff':(q._i*10>=RED?'var(--red)':'#000');}}
    requestAnimationFrame(draw);
  }
  draw();

  /* часы */
  function tick(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  tick(); setInterval(tick,5000);

  /* скорость */
  var lastKmh=null,sweeping=false;
  function setSpeed(kmh){
    lastKmh=kmh; if(sweeping) return;
    if(kmh==null){ $('spd').style.visibility='hidden'; $('noGps').setAttribute('visibility','visible'); target=0; return; }
    $('noGps').setAttribute('visibility','hidden'); $('spd').style.visibility='visible';
    var v=kmh<2?0:Math.round(kmh);
    $('spd').textContent=v; target=v;
  }
  setSpeed(null);

  var last=null;
  function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,
    h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

  if(location.hash==='#demo'){
    var t0=Date.now();
    setInterval(function(){setSpeed(32+32*Math.sin((Date.now()-t0)/3500))},100);
    getTemp(50.45,30.52);
  } else if(navigator.geolocation){
    navigator.geolocation.watchPosition(function(p){
      var c=p.coords, v=c.speed;
      if(v==null||isNaN(v)){
        if(last){var dt=(p.timestamp-last.t)/1000; v=dt>0?hav(last.la,last.lo,c.latitude,c.longitude)/dt:0;} else v=0;
      }
      last={la:c.latitude,lo:c.longitude,t:p.timestamp};
      setSpeed(v*3.6);
      if(!tempAt||Date.now()-tempAt>900000) getTemp(c.latitude,c.longitude);
    },function(){setSpeed(null)},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  }

  /* температура масла = температура воздуха в городе (Open-Meteo) */
  var tempAt=0, manual=false;
  function showTemp(t){$('oil').textContent=Math.round(t)+'°C'}
  function getTemp(la,lo){
    tempAt=Date.now();
    if(manual) return;
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&current=temperature_2m')
      .then(function(r){return r.json()})
      .then(function(j){showTemp(j.current.temperature_2m);try{localStorage.setItem('oil',j.current.temperature_2m)}catch(e){}})
      .catch(function(){});
  }
  try{var s=localStorage.getItem('oil'); if(s!==null) showTemp(parseFloat(s));}catch(e){}
  /* ручной ввод, если интернет/API недоступен: тап по OIL */
  var promptT=0,noPromptUntil=0;
  $('oilBtn').addEventListener('click',function(){
    if(Date.now()<noPromptUntil) return;
    clearTimeout(promptT); promptT=setTimeout(askTemp,650);
  });
  function askTemp(){
    var v=prompt('Температура, °C:');
    if(v===null||v.trim()==='') return;
    var n=parseFloat(v.replace(',','.')); if(isNaN(n)) return;
    manual=true; showTemp(n); try{localStorage.setItem('oil',n)}catch(e){}
  }

  /* удержание экрана 1 с: «инициализация» — стрелка до 60 и обратно */
  var holdT=0,holdFired=false;
  addEventListener('pointerdown',function(){
    clearTimeout(holdT);
    holdT=setTimeout(function(){holdFired=true;clearTimeout(promptT);sweep();},1000);
  });
  function endHold(){clearTimeout(holdT); if(holdFired){holdFired=false;noPromptUntil=Date.now()+400;}}
  addEventListener('pointerup',endHold);
  addEventListener('pointercancel',endHold);
  addEventListener('contextmenu',function(e){e.preventDefault()});
  addEventListener('gesturestart',function(e){e.preventDefault()});
  function sweep(){
    if(sweeping) return; sweeping=true;
    var t0=Date.now(), UP=1100, HOLD=200, DOWN=1400;
    var iv=setInterval(function(){
      var t=Date.now()-t0, v, k;
      if(t<UP){k=t/UP; v=MAX*(1-(1-k)*(1-k));}
      else if(t<UP+HOLD){v=MAX;}
      else if(t<UP+HOLD+DOWN){k=(t-UP-HOLD)/DOWN; v=MAX*(1-k*k);}
      else { clearInterval(iv); sweeping=false; setSpeed(lastKmh); return; }
      $('noGps').setAttribute('visibility','hidden'); $('spd').style.visibility='visible';
      $('spd').textContent=Math.round(v); target=v;
    },40);
  }

  /* не гасить экран */
  addEventListener('click',function(){try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}},{once:true});
})();
</script>
</body>
</html>
